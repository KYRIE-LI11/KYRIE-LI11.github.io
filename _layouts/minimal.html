<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }}{% unless page.url == '/' %} · {{ site.title | escape }}{% endunless %}</title>
  <meta name="description" content="Hanqian Li — M.Phil student at HKUST (GZ). Research in generative model watermarking and multimodal reasoning.">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/minimal.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="wordmark" href="{{ '/' | relative_url }}">Hanqian Li</a>
    <nav aria-label="Main navigation">
      <a href="{{ '/#about' | relative_url }}">About</a>
      <a href="{{ '/#publications' | relative_url }}">Publications</a>
      <a href="{{ '/#background' | relative_url }}">Background</a>
    </nav>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="site-footer">© {{ site.time | date: '%Y' }} Hanqian Li <a href="https://github.com/{{ site.author.github }}">GitHub</a></footer>
</body>
</html>
